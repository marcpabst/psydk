name: CI

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.name }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # name: [ "macOS (arm64)", "Windows (x86_64)" ]
        name: [ "macOS (arm64)"]
        include:
        - name: macOS (arm64)
          platform: macos
          cibw_platform: macos
          runs-on: macos-latest
          archs: auto
        - name: iOS (arm64)
          platform: macos
          cibw_platform: ios
          runs-on: macos-latest
          archs: auto
        # - name: Linux (x86_64)
        #   platform: linux
        #   runs-on: ubuntu-24.04
        #   archs: auto
        # - name: Linux (arm64)
        #   platform: linux
        #   runs-on: ubuntu-24.04-arm
        #   archs: auto
        # - name: Windows (x86_64)
        #   platform: windows
        #   runs-on: windows-latest
        #   archs: auto
    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      # - name: Set up Python
      #   uses: actions/setup-python@v5.5.0
      #   with:
      #     python-version: "3.13"

      # - name: Install cibuildwheel
      #   run: |
      #     python -m pip install -U pip
      #     python -m pip install cibuildwheel
      #


      # - name: Setup GStreamer
      #   id:   setup_gstreamer
      #   uses: blinemedical/setup-gstreamer@v1.4.0
      #   with:
      #     version: '1.24.10'

      # - uses: actions-rust-lang/setup-rust-toolchain@v1
      # - name: Build wheels
      #   working-directory: ./crates/psydk
      #   run: python -m cibuildwheel --output-dir wheelhouse --archs ${{ matrix.archs }}
      #   env:
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        with:
          output-dir: ./crates/psydk/wheelhouse
          platform: ${{ matrix.cibw_platform }}
          archs: ${{ matrix.archs }}
          package-dir: ./crates/psydk
          build: "cp313-*"
        env:
          FORCE_SKIA_BUILD: "1"
          # CIBW_PROJECT_REQUIRES_PYTHON: "<=3.13"
          # CIBW_ARCHS: ${{ matrix.archs }}
          # CIBW_BUILD: "cp313-*"
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_BEFORE_ALL_WINDOWS: |
            git config --system core.longpaths true
            rustup target add i686-pc-windows-msvc
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_BEFORE_ALL_IOS: |
            export PYTHONDIR="./dependencies/build_helpers/iphoneos/" && \
            export IOS_SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) && \
            export PYO3_CROSS_LIB_DIR="$PYTHONDIR" && \
            export PYO3_CROSS_PYTHON_VERSION="$PYTHON_VERSION" && \
            export IPHONEOS_DEPLOYMENT_TARGET: "23.0" && \
            export SDKROOT="$IOS_SDKROOT" && \
            export PYO3_CROSS_LIB_DIR="$PYTHONDIR" && \
            export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-isysroot -C link-arg=$IOS_SDKROOT \
            -C link-arg=-arch -C link-arg=arm64 -C link-arg=-miphoneos-version-min=14.0 -C link-arg=-L \
            -C link-arg=$PYTHONDIR \
            -C link-arg=-undefined \
            -C link-arg=dynamic_lookup" && \
            export MATURIN_PEP517_ARGS="-target aarch64-apple-ios --release"
          MACOSX_DEPLOYMENT_TARGET: 12.0

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cibw-wheel-${{ matrix.name }}
          path: ./crates/psydk/wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Optional, use if you use setuptools_scm
          submodules: true # Optional, use if you have submodules

      - name: Build SDist
        working-directory: ./crates/psydk
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./crates/psydk/dist/*.tar.gz

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [build_wheels, make_sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Build and deploy docs
    runs-on: macos-latest
    # if: "startsWith(github.ref, 'refs/tags/')"
    needs: [build_wheels]
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # get the wheel for macOS (arm64) to build the docs with it
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: cibw-wheel-macOS*
      # install the wheel to build the docs with it
      - name: Install the wheel
        run: pip install ./dist/*-macosx_12_0_arm64.whl
      # install the dependencies to build the docs
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build the docs
        run: |
          sphinx-build -M html docs/source/ docs/build/ -a -j auto -n --keep-going
      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
