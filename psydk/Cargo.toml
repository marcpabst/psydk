[package]
name = "psydk"
version = "0.1.7"
edition = "2021"
rust-version = "1.70"
authors = ["Marc Pabst"]
description = "Psychological and Behavioral Experiment Engine"
repository = "https://github.com/marcpabst/psydk"
license = "MPL-2.0"
keywords = [
    "psychophysics",
    "psychology",
    "experiments",
    "stimuli",
    "perception",
]
categories = [
    "science",
    "science::neuroscience",
    "graphics",
    "gui",
    "multimedia",
]

[lib]
name = "psydk"
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# General dependencies
[dependencies]
# wgpu = { git = "https://github.com/marcpabst/wgpu", rev = "0b24d89" }
wgpu = { path = "../../wgpu/wgpu" }
serde = { version = "1.0", features = ["derive"] }
renderer = { path = "../renderer" }
psydk-proc = { path = "../psydk-proc" }

raw-window-handle = "0.6"
# winit = "0.30.11"
# winit = { git = "https://github.com/rust-windowing/winit", rev = "fa0795a" }
winit = { path = "../../winit/winit" }
bytemuck = { version = "1.14.0", features = ["derive"] }
nalgebra = "0.33.0"
web-time = "1.0.0"
image = "0.24.7"
fontdb = "0.16.0"
fastrand = "1.0.1"
async-broadcast = "=0.7.0"
futures-lite = "2.1.0"
async-channel = "2.1.1"
log = "0.4.20"
num-traits = "0.2.17"
half = { version = "2.3.1", features = ["bytemuck"] }
palette = "0.7.3"
thiserror = "1.0.56"
paste = "1.0.15"
derive-debug = "0.1.2"
downcast-rs = "1.2.1"
dyn-clone = "1.0.17"
enum-fields = "0.1.0"
strum = { version = "0.27", features = ["derive"] }
uuid = { version = "1.8.0", features = ["v4", "fast-rng"] }

pyo3 = { version = "0.23.4", features = [
    "extension-module",
    "abi3-py310",
    "multiple-pymethods",
] }
send_wrapper = "0.6.0"
numpy = "0.23.*"
strum_macros = "0.26.4"
csscolorparser = "0.7.0"
pollster = "0.4.0"
cosmic-text = "0.12.1"
psydk-audio = { path = "../psydk-audio" }

# Gstreamer dependencies
glib = { version = "0.20.10", optional = true }
gstreamer = { version = "0.23.5", optional = true }
gstreamer-app = { version = "0.23.5", optional = true }
gstreamer-video = { version = "0.23.5", optional = true }
gix = "0.70.0"
sysinfo = "0.30.13"
csv = "1.3.1"
fs4 = "0.8.2"

rand = "0.8.5"
thread-priority = "1.2.0"
byte-slice-cast = "1.2.3"
crossbeam-utils = "0.8.21"
arc-swap = "1.7.1"
ringbuf = "0.4.8"
atomic_float = "1.1.0"
lcms2 = "6.1.1"
serde_json = "1.0.145"
ndarray = "0.16.1"
# tikv-jemallocator = { version = "0.5.4", features = ["profiling"] }

# Windows dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Wdk_Graphics_Direct3D",
    "Win32_Media",
    "Win32_Media_Multimedia",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_Devices_Display",
] }

# MacOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.1" }
objc2-app-kit = { version = "0.3.1" }
objc2-foundation = "0.3.1"
objc2-core-foundation = "0.3.1"

# iOS dependencies
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.1" }
objc2-ui-kit = { version = "0.3.1" }
objc2-foundation = "0.3.1"
objc2-core-foundation = "0.3.1"
block2 = "0.6.1"

[features]
default = ["metal", "dx12", "gst"]
gst = ["dep:glib", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
metal = []
dx12 = []

# include debug symbols in release builds
[profile.release]
debug = true
